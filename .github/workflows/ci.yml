name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Smoke test the CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js --help | head -5
          # Non-TTY with no prompt must print help, not launch the TUI.
          out=$(node dist/cli.js < /dev/null | head -1) || true
          case "$out" in
            Mochi*|Usage*) echo "CLI smoke OK" ;;
            *) echo "Unexpected CLI output: $out"; exit 1 ;;
          esac
